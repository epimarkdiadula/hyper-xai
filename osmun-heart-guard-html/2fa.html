<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Two-Factor Authentication — OSMun-XAI</title><link rel="icon" href="favicon.ico"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"/><link rel="stylesheet" href="css/styles.css"/></head>
<body class="auth-page"><div class="auth-simple-shell"><div class="auth-simple-card auth-2fa-card"><div class="auth-logo">⌁</div><h1>Two-factor authentication</h1><p class="auth-subtitle">Enter the 6-digit verification code to continue.</p><div class="auth-info">ⓘ A verification code has been sent to your registered authenticator app. <strong>For this capstone prototype, use 123456.</strong></div><div id="twofa-message" class="auth-message" hidden></div><form id="twofa-form"><label for="code">Authentication Code</label><input id="code" class="code-input" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" placeholder="0 0 0 0 0 0" required/><button class="auth-primary" type="submit">Verify and sign in</button></form><p class="auth-create"><a href="login.html">← Back to sign in</a></p><div class="auth-security">♢ &nbsp; Authorized clinical personnel only. Access activity is logged and monitored.</div></div></div><script src="js/auth.js"></script><script>
if (!sessionStorage.getItem(AUTH_2FA_KEY)) window.location.replace('login.html');
const form=document.getElementById('twofa-form'), msg=document.getElementById('twofa-message');
form.addEventListener('submit',e=>{e.preventDefault();const r=authVerify2FA(document.getElementById('code').value);if(!r.ok){msg.hidden=false;msg.className='auth-message error';msg.textContent=r.message;return;}window.location.href='index.html';});
</script></body></html>
